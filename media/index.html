      <script src="/media/articles.js"></script>
      <script>
        (function renderMediaList() {
          const list = document.getElementById("media-list");
          const articles = window.MEDIA_ARTICLES;
          if (!list || !Array.isArray(articles)) return;

          const esc = (s) =>
            String(s ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");

          const getTime = (item) => (item.datetime ? Date.parse(item.datetime) || 0 : 0);

          list.innerHTML = articles
            .slice()
            .sort((a, b) => getTime(b) - getTime(a))
            .map(
              (item) =>
                `<li>${
                  item.image
                    ? `<img src="${esc(item.image)}" alt="${esc(item.outlet)}" class="media-list-icon" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'" />`
                    : ""
                }<a class="media-list-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></li>`,
            )
            .join("");
        })();
      </script>
